  rationale: 'On 2026-11-24 the AI Video Workflow Space shipped and was reworked the same day because the first delivery was never verified by use: V1 admitted the exports were not opened one by one (message:64cf6b96), the canvas was a timeline list instead of a true node canvas (message:77b8f7ab), the user called it very unprofessional against the BeefTV reference (message:e4105058), status was set by hand (message:2d741a77), and there was no execute button at all (message:fc970336), until a full audit (message:4633609b) removed dead controls. No existing skill covers this: generated_video_delivery_check governs generated video only, and skill searches for deliverable and build verification returned no match. The new skill forces the missing step, open every export and exercise every claimed control, before a build is presented as finished. Consolidation was reviewed first: 12 active learned skills share no mergeable overlap, the script cluster covers distinct stages with distinct proxies and the delivery cluster covers distinct checks, so no retirement is proposed. The EP3 overnight film was checked and left alone because generated_video_delivery_check already forbids presenting a failed preview as finished and is inside its window to 2026-12-05.'
