  rationale: 'On 2026-11-20 the door segment ran versions 2 to 14 with only the first 10 seconds usable, and the user asked why a whole night had not produced even the first 30 seconds (message:98dacf50-846b-467c-8bec-8499a1416b59); the assistant admitted grinding one variable at a time too long without changing approach or escalating cost. The same loop repeated on the 50 to 60 second corpse-tide segment (versions 13 to 15, message:assistant-msg-2f2dc6e3-243f-4a35-b732-8f8529dbb964) and on tentacle and gunfire corrections. No managed skill caps consecutive playable-but-wrong versions: video_generation_retry governs transient service failures and keeps prompts unchanged, generated_video_delivery_check judges finished video, seedance_shot_director writes prompts, and script_first_production_gate blocks unscripted beats. The new skill counts content failures separately, forces one approach change after three, and stops for a user decision after five. Repaired per the conflict verdict: the five-failure stop now yields to an explicit user instruction to keep trying until success, and approach changes preserve the locked prompt, references, format, duration and locked lines unless the user approves a change, so split, first-frame and reference changes are approval-gated. Consolidation at 11 active learned skills was reviewed and no merge was made (distinct stages and proxies). The delivery-check full-body gap was left alone because that skill is inside its window until 2026-12-05 and review is currently off by user order; backup cron failures are an authorisation decision, not a method; repeated-handoff candidates are trigger cadence, not a managed document.'
