  needs_review: false
  rationale: On 2026-11-18 the EP2 revision batch failed 6 of 6 with video_not_available and retryable false, a lasting regional restriction, and retests at 05:00 and 05:57 were still blocked. The assistant first reported only 3 failures because the generation script copied any new file as a success, including 958 byte JSON error files. The current video_generation_retry skill has no stopping rule for a lasting restriction and no rule that an output must be playable video before it counts as a success, so this update adds both while keeping the transient retry rule unchanged. Consolidation of the 11 active learned skills was reviewed and no merge was made because the script cluster covers distinct stages with distinct measured proxies. The Fish Audio connector already documents the verified tag format, the prose-read-aloud failure, and the wolf voice, so no change was needed there, and the 104 bare tool failures carry no error detail to ground a change.
