  rationale: 'With 13 active learned skills the consolidation gate applies. correction_stays_local and script_surgical_revision split one discipline, pointed-span scope, by surface, and neither named image or design work. On 2026-11-26 the EP3 cosmic cue loop violated that discipline repeatedly while both skills were in force and include_in_prompt true: flatness was applied to the tip instead of the grip, a concave step was made where a flat slope was asked for, the whole grip was bent where only the grip-to-housing joint needed an arc, and the tail end was reworked although the user never mentioned it (messages 5dfec766, b1c4fda2, 82b47e76, fff852d3, f9be92e6, 849b1950, ff0e7ef1, 2c021beb, 6b308dbd). The merged skill preserves both prior mechanisms, the general-versus-local test with quoted general wording and the pointed-span list with span-by-span proof, and extends the span naming to image and design regions, which is the uncovered surface that produced this loop. Both superseded skills are past their measurement windows (review_after 2026-11-26 and 2026-11-23), so merging now does not disturb an active measurement window. Other clusters were reviewed and left unmerged: the video cluster (delivery check, iteration escalation, generation retry) and the script cluster (canon provenance, first gate, density budget, shot director) cover distinct stages with distinct proxies, and generation_iteration_escalation and generated_video_delivery_check remain inside their windows to 2026-12-12 and 2026-12-05, so the Scene 14 retry pattern was not used to amend them.'
