name: local_momo_ink_comedy
title: Local momo ink comedy
description: 为AI短片IP「墨团团」锁定《猫和老鼠》式故事风格与夸张表演方式，并据此撰写单集短视频脚本。墨团团是一只由液态墨水构成、能像毒液一样自由变形的小狗，可爆发变身「四臂魔王」形态（四臂、恶魔翅、弯角、兽尾，黑金配色），颈挂青铜铃铛红流苏，视觉为水墨国风×卡通。当用户要求为这个IP写剧本/脚本/分镜/笑点方案、生成搞笑动画短片剧情、每集换对手的连载笑点，或需要把风格锁进视频生成提示词时使用。覆盖：单集脚本撰写、笑点设计、分镜与AI视频提示词转换、风格一致性质检。每集30–60秒，中文脚本。
