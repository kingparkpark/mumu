  rationale: 'On 2026-11-14 the user asked for a direct regeneration of beat 3 with a locked clockwise 90 degree roll (message:1cc5089c). The assistant instead delivered a post processed version, a horizontal source pixel rotated 90 degrees clockwise after the flip and spliced onto a prior vertical opening (assistant-msg-c3d02793). The user caught it in message:7cdd1fc2, asking why the picture was degraded, why the sound did not match, and whether this was generated video or post processing. The assistant admitted in assistant-msg-a3b49b99 that the version was spliced from a rotated horizontal source and two different audio tracks, that this route was void, and that later deliveries would be direct generation only with post processing limited to denoise and loudness. That rule lives only in conversation. No managed skill forbids the substitution: generated_video_delivery_check governs checking a finished video, seedance_shot_director governs prompt writing, and video_generation_retry governs retrying transient failures. The fix adds the direct generation rule to the delivery check skill, the skill that decides what may be presented as finished. Consolidation was reviewed and no merge was made: 9 active managed learned skills, below the 10 trigger, with distinct measured proxies, and the 120 bare tool failures in chunk 2 carry no error detail to ground a change.'
