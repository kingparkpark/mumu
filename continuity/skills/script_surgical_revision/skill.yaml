  rationale: 'On 2026-11-01 a pointed correction repeatedly widened into an unrequested revision: six new characters were stocked in one reply and rejected, and a question about a note became a rewritten line plus an added passage, followed by several rounds in which the user narrowed the scope, rejected the added passage, and then said the original passage was fine. The existing script_canon_provenance_check governs whether a new element has an approved source and generated_video_delivery_check governs a finished video, but neither governs edit scope in an already delivered document, so even sourced material can be rewritten without being pointed at. This skill closes that distinct gap with a pointed-span list, a ban on touching unlisted spans, and a span-by-span scope proof plus full-document delivery in the same reply.'
